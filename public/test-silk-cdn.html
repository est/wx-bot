<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>silk-wasm CDN Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #569cd6; }
    #results { white-space: pre-wrap; line-height: 1.6; }
    .pass { color: #6a9955; }
    .fail { color: #f44747; }
    .info { color: #569cd6; }
  </style>
</head>
<body>
  <h1>silk-wasm CDN Test</h1>
  <p>Open browser console (F12) for detailed logs. Results also shown below:</p>
  <div id="results"></div>

  <script>
    const resultsDiv = document.getElementById("results");
    const origLog = console.log;
    const origErr = console.error;
    const origWarn = console.warn;

    function logToPage(...args) {
      const line = args.join(" ");
      const div = document.createElement("div");
      if (line.includes("✅") || line.includes("PASS")) div.className = "pass";
      else if (line.includes("❌") || line.includes("FAIL")) div.className = "fail";
      else if (line.startsWith("===")) div.className = "info";
      div.textContent = line;
      resultsDiv.appendChild(div);
      resultsDiv.scrollTop = resultsDiv.scrollHeight;
    }

    console.log = (...args) => { origLog(...args); logToPage(...args); };
    console.error = (...args) => { origErr(...args); logToPage("ERROR:", ...args); };
    console.warn = (...args) => { origWarn(...args); logToPage("WARN:", ...args); };
  </script>
  <script src="test-silk-cdn.js"></script>
</body>
</html>
